<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>화면 수신기</title>
<style>
  :root{--bg:#0f1115;--side:#1a1d24;--line:#2a2f3a;--txt:#e8eaf0;--dim:#7c8394;--ok:#3ddc84;--acc:#4f8cff}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#000;color:var(--txt);font-family:system-ui,"Malgun Gothic",sans-serif;overflow:hidden}
  #app{display:flex;height:100%}
  #side{width:220px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;transition:margin-left .15s;flex-shrink:0}
  #side.hidden{margin-left:-220px}
  .head{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;font-weight:600;border-bottom:1px solid var(--line)}
  .head button,.tool button{background:none;border:0;color:var(--dim);font-size:16px;cursor:pointer;padding:4px 8px}
  #list{flex:1;overflow:auto;padding:8px}
  .dev{display:flex;align-items:center;gap:10px;padding:12px;border-radius:10px;margin-bottom:6px;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation}
  .dev:hover{background:#242936}
  .dev.cur{background:#24324f;outline:1px solid var(--acc)}
  .dev.off{opacity:.4;cursor:default}
  .dev.off:hover{background:none}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--dim);flex-shrink:0}
  .dev:not(.off) .dot{background:var(--ok)}
  .empty{color:var(--dim);font-size:13px;padding:12px;line-height:1.5}
  .tool{border-top:1px solid var(--line);padding:6px;display:flex;justify-content:space-between}
  #stage{flex:1;position:relative;background:#000;min-width:0}
  #img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
  #msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--dim);font-size:20px;line-height:1.6;pointer-events:none;white-space:pre-line}
  #open{position:absolute;left:0;top:0;z-index:5;background:#1a1d24cc;color:var(--txt);border:0;padding:10px 12px;border-radius:0 0 10px 0;cursor:pointer;display:none}
  #side.hidden ~ #stage #open{display:block}
  #menu{position:fixed;z-index:20;background:#242936;border:1px solid var(--line);border-radius:10px;padding:4px;display:none}
  #menu button{display:block;background:none;border:0;color:#ff7b7b;font-size:15px;padding:10px 18px;cursor:pointer;width:100%;text-align:left}
  .modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:30}
  .box{background:var(--side);border:1px solid var(--line);border-radius:14px;padding:20px;min-width:300px;max-width:90vw}
  .box p{margin:0 0 16px;font-size:16px;line-height:1.5}
  .box input{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:#0f1115;color:var(--txt);margin-bottom:12px}
  .btns{display:flex;gap:8px;justify-content:flex-end}
  .btns button{padding:9px 16px;border-radius:8px;border:0;font-size:14px;cursor:pointer;background:#2a2f3a;color:var(--txt)}
  .btns button.danger{background:#d64545}
  .btns button.pri{background:var(--acc)}
</style>
</head>
<body>
<div id="app">
  <div id="side">
    <div class="head"><span>태블릿</span><button id="fold" title="접기">◀</button></div>
    <div id="list"></div>
    <div class="tool"><button id="refresh" title="새로고침">⟳</button><button id="gear" title="설정">⚙</button></div>
  </div>
  <div id="stage">
    <button id="open" title="목록 열기">▶</button>
    <img id="img" alt="">
    <div id="msg"></div>
  </div>
</div>

<div id="menu"><button id="menuStop">종료하기</button></div>

<div class="modal" id="mConfirm"><div class="box">
  <p id="confirmText"></p>
  <div class="btns"><button id="cCancel">취소</button><button class="danger" id="cOk">종료하기</button></div>
</div></div>

<div class="modal" id="mSet"><div class="box">
  <p>Apps Script URL</p>
  <input id="urlIn" placeholder="https://script.google.com/macros/s/.../exec">
  <div class="btns"><button id="sReset">초기화</button><button id="sClose">닫기</button><button class="pri" id="sSave">저장</button></div>
</div></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const LS = { get:k=>{try{return localStorage.getItem(k)||''}catch(e){return ''}}, set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}} };

  let url = LS.get('url');
  let devices = [];          // {name, ip, port, online}
  let curName = LS.get('last');   // 보고 싶은 기기 이름
  let shown = null;          // 현재 화면에 붙어 있는 {name, ip, port}
  let lastList = 0, busy = false, failStreak = 0;

  const img = $('img'), msg = $('msg');
  function setMsg(t){ msg.textContent = t || ''; msg.style.display = t ? 'flex' : 'none'; }

  async function tfetch(u, ms=1500, opt={}){
    const c = new AbortController(); const t = setTimeout(()=>c.abort(), ms);
    try { return await fetch(u, {cache:'no-store', signal:c.signal, ...opt}); }
    finally { clearTimeout(t); }
  }

  async function fetchList(){
    if(!url) return;
    lastList = Date.now();
    try {
      const r = await tfetch(url + (url.includes('?')?'&':'?') + 'action=list', 10000);
      const j = await r.json();
      if(j && j.devices){
        const old = new Map(devices.map(d=>[d.name,d]));
        devices = j.devices.map(d => ({...d, online: (old.get(d.name)||{}).online || false}));
      }
    } catch(e){}
  }

  async function ping(d){
    try { const r = await tfetch(`http://${d.ip}:${d.port}/status`, 1500); const j = await r.json(); return !!(j && j.on); }
    catch(e){ return false; }
  }

  function connect(d){
    curName = d.name; LS.set('last', d.name);
    shown = {name:d.name, ip:d.ip, port:d.port};
    img.src = `http://${d.ip}:${d.port}/stream?t=${Date.now()}`;
    setMsg('');
    render();
  }
  function disconnect(text){
    shown = null; img.removeAttribute('src'); setMsg(text); render();
  }
  img.addEventListener('error', () => { if(shown){ disconnect('연결 끊김\n재연결 중…'); } });

  function render(){
    const L = $('list'); L.innerHTML = '';
    if(!url){ L.innerHTML = '<div class="empty">⚙ 설정에서<br>Apps Script URL을<br>입력하세요.</div>'; return; }
    if(!devices.length){ L.innerHTML = '<div class="empty">켜진 태블릿이 없어요.</div>'; return; }
    devices.forEach(d => {
      const el = document.createElement('div');
      el.className = 'dev' + (d.online ? '' : ' off') + (shown && shown.name===d.name ? ' cur' : '');
      el.innerHTML = '<span class="dot"></span><span></span>';
      el.lastChild.textContent = d.name;
      let timer = null, longFired = false;
      el.addEventListener('pointerdown', e => {
        if(!d.online || e.button===2) return;
        longFired = false;
        timer = setTimeout(()=>{ longFired = true; openMenu(d, e.clientX, e.clientY); }, 600);
      });
      const cancel = () => { clearTimeout(timer); };
      el.addEventListener('pointerup', cancel);
      el.addEventListener('pointerleave', cancel);
      el.addEventListener('pointermove', e => { if(Math.abs(e.movementX)+Math.abs(e.movementY) > 6) cancel(); });
      el.addEventListener('click', () => { if(longFired){ longFired=false; return; } if(d.online) connect(d); });
      el.addEventListener('contextmenu', e => { e.preventDefault(); if(d.online) openMenu(d, e.clientX, e.clientY); });
      L.appendChild(el);
    });
  }

  // ---- 종료 메뉴 / 확인 ----
  let menuDev = null;
  function openMenu(d, x, y){
    menuDev = d; const m = $('menu');
    m.style.display = 'block';
    m.style.left = Math.min(x, innerWidth-140) + 'px';
    m.style.top = Math.min(y, innerHeight-60) + 'px';
  }
  function closeMenu(){ $('menu').style.display = 'none'; }
  document.addEventListener('pointerdown', e => { if(!$('menu').contains(e.target)) closeMenu(); });
  $('menuStop').onclick = () => {
    closeMenu();
    $('confirmText').textContent = `‘${menuDev.name}’ 공유를 종료하시겠습니까?`;
    $('mConfirm').style.display = 'flex';
  };
  $('cCancel').onclick = () => { $('mConfirm').style.display = 'none'; };
  $('cOk').onclick = async () => {
    $('mConfirm').style.display = 'none';
    const d = menuDev;
    try { await tfetch(`http://${d.ip}:${d.port}/stop`, 3000); } catch(e){}
    d.online = false;
    if(shown && shown.name===d.name){ disconnect('공유가 종료되었습니다\n대기 중…'); }
    else render();
  };

  // ---- 설정 ----
  $('gear').onclick = () => { $('urlIn').value = url; $('mSet').style.display = 'flex'; };
  $('sClose').onclick = () => { $('mSet').style.display = 'none'; };
  $('sSave').onclick = () => { url = $('urlIn').value.trim(); LS.set('url', url); $('mSet').style.display='none'; devices=[]; render(); fetchList().then(tick); };
  $('sReset').onclick = () => { url=''; LS.set('url',''); $('urlIn').value=''; devices=[]; disconnect('설정에서 Apps Script URL을 입력하세요'); };
  $('refresh').onclick = async () => { await fetchList(); tick(); };
  $('fold').onclick = () => $('side').classList.add('hidden');
  $('open').onclick = () => $('side').classList.remove('hidden');

  // ---- 메인 루프: 3초마다 직접 /status 확인 (시트 요청 아님) ----
  async function tick(){
    if(busy) return; busy = true;
    try {
      if(!url){ render(); return; }
      const waiting = !shown || !devices.some(d=>d.name===(shown&&shown.name)&&d.online);
      const every = waiting ? 10000 : 60000;
      if(Date.now() - lastList > every) await fetchList();

      await Promise.all(devices.map(async d => { d.online = await ping(d); }));

      if(shown){
        const d = devices.find(x => x.name === shown.name);
        if(!d || !d.online){
          failStreak++;
          if(failStreak >= 2) disconnect('연결 끊김\n재연결 중…');
          if(failStreak >= 5) { await fetchList(); }
        }
      }
      const online = devices.filter(d => d.online);
      // 같은 기기가 IP/포트를 바꿨다면 다시 연결
      if(shown){
        const d = online.find(x => x.name === shown.name);
        if(d && (d.ip !== shown.ip || d.port !== shown.port)) connect(d);
        else if(d) failStreak = 0;
      }
      // 연결 안 된 상태: 직전 기기 → 하나뿐이면 자동 연결
      if(!shown){
        const pref = online.find(d => d.name === curName);
        const pick = pref || (online.length === 1 ? online[0] : null);
        if(pick){ failStreak = 0; connect(pick); }
        else setMsg(online.length ? '왼쪽 목록에서\n태블릿을 선택하세요' : '대기 중\n켜진 태블릿이 없어요');
      }
      render();
    } finally { busy = false; }
  }

  setMsg(url ? '불러오는 중…' : '설정(⚙)에서 Apps Script URL을 입력하세요');
  render();
  if(!url) $('gear').click();
  fetchList().then(tick);
  setInterval(tick, 3000);
})();
</script>
</body>
</html>
